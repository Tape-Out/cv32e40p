  params:
    COREV_CLUSTER: corevCluster
    COREV_PULP: corevPulp
    FPU: fpu
    FPU_ADDMUL_LAT: fpuAddmulLat
    FPU_OTHERS_LAT: fpuOthersLat
    NUM_MHPMCOUNTERS: numMhpmcounters
    ZFINX: zfinx
  clock:
    port: clk_i
  reset:
    port: rst_ni
    active: low
    sync: true
  ports:
  # 取指与访存各一条 OBI：req/gnt/rvalid，PULP 自己那套开放总线接口
  - endpoint: instr
    kind: transaction
    role: manager
    profile: obi
    prefix: instr_
  - endpoint: data
    kind: transaction
    role: manager
    profile: obi
    prefix: data_
  # 中断按 CLIC 的形状：一条 32 位向量进来，应答与编号出去
  - endpoint: irq
    kind: event
    role: sink
    map:
      irq: irq_i
      ack: irq_ack_o
      id: irq_id_o
  # 调试握手：请求进来，三个状态出去
  - endpoint: debug
    kind: physical
    type: Cv32DebugPins
    prefix: debug_
  - endpoint: pins
    kind: physical
    type: Cv32Pins
    map:
      bootAddr: boot_addr_i
      coreSleep: core_sleep_o
      dmExceptionAddr: dm_exception_addr_i
      dmHaltAddr: dm_halt_addr_i
      fetchEnable: fetch_enable_i
      hartId: hart_id_i
      mtvecAddr: mtvec_addr_i
      pulpClockEn: pulp_clock_en_i
      scanCgEn: scan_cg_en_i
  limits:
  - 存储口是 OBI，不是 AXI；要挂总线得在外面加桥
  - corevCluster 要 corevPulp 一起开，上游文档如此
  - 上游不带预编译固件，所以这一版没有上游测试，只有逐点展开与声明回执
test:
  noarea:
  - numMhpmcounters
  - fpuAddmulLat
  - fpuOthersLat
targets:
  foreign:
    driver: foreign
