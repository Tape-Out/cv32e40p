name: cv32e40p
version: 0.1.0
spec: '0.1'
kind: ip
lang: sv
identity:
  slug: cv32e40p-tapeout-foreign
  display_name: CV32E40P
  summary: PULP's RV32 core with the CORE-V extensions, taken as a black box.
  category: processor
  subcategories:
  - riscv
  ip_family: cv32e40p
  integration_profile: []
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
params:
  # 上游把这些开关声明成 int 而不是 1 位，所以它们是取值不是布尔。
  # 量程是照上游文档给的，好让矩阵真的两档都走一遍
  corevPulp:
    type: int
    default: 0
    range: [0, 1]
  corevCluster:
    type: int
    default: 0
    range: [0, 1]
  fpu:
    type: int
    default: 0
    range: [0, 1]
  fpuAddmulLat:
    type: int
    default: 0
    range: [0, 2]
  fpuOthersLat:
    type: int
    default: 0
    range: [0, 2]
  zfinx:
    type: int
    default: 0
    range: [0, 1]
  numMhpmcounters:
    type: int
    default: 1
    range: [0, 29]
emit:
- kind: foreign
  lang: sv
  top: cv32e40p_top
  rtl:
  - third_party/cv32e40p/rtl/include/cv32e40p_apu_core_pkg.sv
  - third_party/cv32e40p/rtl/include/cv32e40p_fpu_pkg.sv
  - third_party/cv32e40p/rtl/include/cv32e40p_pkg.sv
  - third_party/cv32e40p/rtl/cv32e40p_if_stage.sv
  - third_party/cv32e40p/rtl/cv32e40p_cs_registers.sv
  - third_party/cv32e40p/rtl/cv32e40p_register_file_ff.sv
  - third_party/cv32e40p/rtl/cv32e40p_load_store_unit.sv
  - third_party/cv32e40p/rtl/cv32e40p_id_stage.sv
  - third_party/cv32e40p/rtl/cv32e40p_aligner.sv
  - third_party/cv32e40p/rtl/cv32e40p_decoder.sv
  - third_party/cv32e40p/rtl/cv32e40p_compressed_decoder.sv
  - third_party/cv32e40p/rtl/cv32e40p_fifo.sv
  - third_party/cv32e40p/rtl/cv32e40p_prefetch_buffer.sv
  - third_party/cv32e40p/rtl/cv32e40p_hwloop_regs.sv
  - third_party/cv32e40p/rtl/cv32e40p_mult.sv
  - third_party/cv32e40p/rtl/cv32e40p_int_controller.sv
  - third_party/cv32e40p/rtl/cv32e40p_ex_stage.sv
  - third_party/cv32e40p/rtl/cv32e40p_alu_div.sv
  - third_party/cv32e40p/rtl/cv32e40p_alu.sv
  - third_party/cv32e40p/rtl/cv32e40p_ff_one.sv
  - third_party/cv32e40p/rtl/cv32e40p_popcnt.sv
  - third_party/cv32e40p/rtl/cv32e40p_apu_disp.sv
  - third_party/cv32e40p/rtl/cv32e40p_controller.sv
  - third_party/cv32e40p/rtl/cv32e40p_obi_interface.sv
  - third_party/cv32e40p/rtl/cv32e40p_prefetch_controller.sv
  - third_party/cv32e40p/rtl/cv32e40p_sleep_unit.sv
  - third_party/cv32e40p/rtl/cv32e40p_core.sv
  - third_party/cv32e40p/rtl/vendor/pulp_platform_common_cells/src/cf_math_pkg.sv
  - third_party/cv32e40p/rtl/vendor/pulp_platform_common_cells/src/rr_arb_tree.sv
  - third_party/cv32e40p/rtl/vendor/pulp_platform_common_cells/src/lzc.sv
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_pkg.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/clk/rtl/gated_clk_cell.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_ctrl.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_ff1.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_pack_single.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_prepare.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_round_single.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_special.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_srt_single.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_top.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fpu/rtl/pa_fpu_dp.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fpu/rtl/pa_fpu_frbus.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fpu/rtl/pa_fpu_src_type.v
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_divsqrt_th_32.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_classifier.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_rounding.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_cast_multi.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_fma_multi.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_noncomp.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_opgroup_fmt_slice.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_opgroup_multifmt_slice.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_opgroup_block.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/vendor/pulp_platform_fpnew/src/fpnew_top.sv
    when: {fpu: 1}
  - path: third_party/cv32e40p/rtl/cv32e40p_fp_wrapper.sv
    when: {fpu: 1}
  - third_party/cv32e40p/rtl/cv32e40p_top.sv
  - third_party/cv32e40p/bhv/cv32e40p_sim_clock_gate.sv
  defines:
  - VERILATOR
  includes:
  - third_party/cv32e40p/rtl/include
  - third_party/cv32e40p/bhv
  - third_party/cv32e40p/bhv/include
  - third_party/cv32e40p/sva
  - third_party/cv32e40p/rtl/vendor/pulp_platform_common_cells/include
  - third_party/cv32e40p/rtl/vendor/pulp_platform_common_cells/include
  params:
    COREV_CLUSTER: corevCluster
    COREV_PULP: corevPulp
    FPU: fpu
    FPU_ADDMUL_LAT: fpuAddmulLat
    FPU_OTHERS_LAT: fpuOthersLat
    NUM_MHPMCOUNTERS: numMhpmcounters
    ZFINX: zfinx
  clock:
    port: clk_i
  reset:
    port: rst_ni
    active: low
    sync: true
  ports:
  # 取指与访存各一条 OBI：req/gnt/rvalid，PULP 自己那套开放总线接口
  - endpoint: instr
    kind: transaction
    role: manager
    profile: obi
    prefix: instr_
  - endpoint: data
    kind: transaction
    role: manager
    profile: obi
    prefix: data_
  # 中断按 CLIC 的形状：一条 32 位向量进来，应答与编号出去
  - endpoint: irq
    kind: event
    role: sink
    map:
      irq: irq_i
      ack: irq_ack_o
      id: irq_id_o
  # 调试握手：请求进来，三个状态出去
  - endpoint: debug
    kind: physical
    type: Cv32DebugPins
    prefix: debug_
  - endpoint: pins
    kind: physical
    type: Cv32Pins
    map:
      bootAddr: boot_addr_i
      coreSleep: core_sleep_o
      dmExceptionAddr: dm_exception_addr_i
      dmHaltAddr: dm_halt_addr_i
      fetchEnable: fetch_enable_i
      hartId: hart_id_i
      mtvecAddr: mtvec_addr_i
      pulpClockEn: pulp_clock_en_i
      scanCgEn: scan_cg_en_i
  limits:
  - 存储口是 OBI，不是 AXI；要挂总线得在外面加桥
  - corevCluster 要 corevPulp 一起开，上游文档如此
  - 上游不带预编译固件，所以这一版没有上游测试，只有逐点展开与声明回执
test:
  noarea:
  - numMhpmcounters
  - fpuAddmulLat
  - fpuOthersLat
targets:
  foreign:
    driver: foreign
