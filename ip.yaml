name: cv32e40p
version: 0.1.0
spec: '0.1'
kind: ip
lang: sv
identity:
  slug: cv32e40p-tapeout-foreign
  display_name: CV32E40P
  summary: PULP's RV32 core with the CORE-V extensions, taken as a black box.
  category: processor
  subcategories:
  - riscv
  ip_family: cv32e40p
  integration_profile: []
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
params:
  # 上游把这些开关声明成 int 而不是 1 位，所以它们是取值不是布尔。
  # 量程是照上游文档给的，好让矩阵真的两档都走一遍
  corevPulp:
    type: int
    default: 0
    range: [0, 1]
  corevCluster:
    type: int
    default: 0
    range: [0, 1]
  fpu:
    type: int
    default: 0
    range: [0, 1]
  fpuAddmulLat:
    type: int
    default: 0
    range: [0, 2]
  fpuOthersLat:
    type: int
    default: 0
    range: [0, 2]
  zfinx:
    type: int
    default: 0
    range: [0, 1]
  numMhpmcounters:
    type: int
    default: 1
    range: [0, 29]
emit:
- kind: foreign
  lang: sv
  top: cv32e40p_top
